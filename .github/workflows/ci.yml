name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # (no macOS: GitHub's Mac runners are often not to be had - a run failed waiting 15 minutes for one, 2026-10-26;
        # the macOS programs are still built below and in every release)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ffmpeg and libvips (media tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libvips-tools
      - run: go vet ./...
      - run: go test ./...
      - name: Benchmarks (short run, catches broken benchmarks)
        run: go test -run "^$" -bench . -benchtime 10x ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Race detector
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }} (pure Go, no cgo)
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -trimpath -o /dev/null ./cmd/vitrine

  # The flake still builds (a change in go.sum or package-lock.json needs a new hash in nix/package.nix: this prints it),
  # and the NixOS module works on a real system. See docs/architecture/nixos.md.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Let the test's VM use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: system-features = kvm nixos-test benchmark big-parallel
      - run: nix build .#checks.x86_64-linux.module -L
