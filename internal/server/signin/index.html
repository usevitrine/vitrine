<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/_s/signin.css">
<script src="/_s/signin.js" defer></script>
</head>
<body>
<main>
<form id="f" autocomplete="on">
<h1>Sign in</h1>
<div id="pw">
<label>Name<input name="name" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button>
</div>
<button id="pk" type="button" class="alt" hidden>Sign in with a passkey</button>
<p id="e" role="alert"></p>
</form>
</main>
</body>
</html>
