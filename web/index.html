<!doctype html>
<html lang="en" style="background:#1e1e2e">
  <head>
    <meta charset="utf-8" />
    <!-- Like hydrus-web: no viewport-fit=cover and no translucent status bar, so iOS gives the status bar its own
         strip (theme color) and lays the page out in the full area below it. Drawing under the status bar caused a
         gap at the bottom of the home-screen app and put content under iOS 27's blurred status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vitrine" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=2" />
    <!-- The home-screen app's launch screen (iPhones; one per screen size, drawn by the server; v: raised when the
         logo changes, so no saved copy of an old one is used): the splash below,
         so nothing is blank from the tap until the page draws. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1320&amp;h=2868&amp;top=186&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1206&amp;h=2622&amp;top=186&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1260&amp;h=2736&amp;top=186&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1290&amp;h=2796&amp;top=177&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1179&amp;h=2556&amp;top=177&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1284&amp;h=2778&amp;top=141&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1170&amp;h=2532&amp;top=141&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1125&amp;h=2436&amp;top=132&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1080&amp;h=2340&amp;top=150&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1242&amp;h=2688&amp;top=132&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/startup.png?w=828&amp;h=1792&amp;top=96&amp;scale=2&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup.png?w=1242&amp;h=2208&amp;top=60&amp;scale=3&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/startup.png?w=750&amp;h=1334&amp;top=40&amp;scale=2&amp;v=2" />
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/startup.png?w=640&amp;h=1136&amp;top=40&amp;scale=2&amp;v=2" />
    <!-- Lines the splash up with the launch image (before the first paint). -->
    <script src="/splash.js"></script>
    <title>Vitrine</title>
  </head>
  <body style="margin:0;background:#1e1e2e">
    <!-- Shown until the app draws its first screen (main.ts removes it); not on Android (splash.js). -->
    <div id="splash" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;display:var(--splash-display, grid);place-items:center;background:#1e1e2e;z-index:100">
      <!-- The icon inline (not a file to fetch): there in the very first frame, as on the launch image. -->
      <svg width="64" height="64" viewBox="0 0 64 64" style="border-radius:14px;opacity:0.9;transform:translateY(var(--splash-shift, 0px))">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#f5c2e7"/></linearGradient></defs>
        <rect width="64" height="64" rx="14" fill="#1e1e2e"/>
        <g transform="translate(0 -2)">
        <polygon points="11,14 23,14 32,40 32,54" fill="url(#g)"/><polygon points="11,14 23,14 32,40 32,54" fill="#fff" opacity=".22"/>
        <polygon points="11,14 32,54 21,40" fill="url(#g)"/><polygon points="11,14 32,54 21,40" fill="#1e1e2e" opacity=".05"/>
        <polygon points="41,14 53,14 32,54 32,40" fill="url(#g)"/><polygon points="41,14 53,14 32,54 32,40" fill="#1e1e2e" opacity=".12"/>
        <polygon points="53,14 43,40 32,54" fill="url(#g)"/><polygon points="53,14 43,40 32,54" fill="#1e1e2e" opacity=".28"/>
        </g>
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
